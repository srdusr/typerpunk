<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 28" width="280" height="56">
  <!-- A circuit-board-style defensive layer: a solid bar with angular teeth
       above and below, echoing the terminal/hacking aesthetic instead of a
       flat rectangle. -->
  <rect x="4" y="10" width="132" height="8" fill="#ffffff"/>
  <rect x="14" y="2" width="14" height="8" fill="#ffffff"/>
  <rect x="42" y="2" width="14" height="8" fill="#ffffff"/>
  <rect x="70" y="2" width="14" height="8" fill="#ffffff"/>
  <rect x="98" y="2" width="14" height="8" fill="#ffffff"/>
  <rect x="14" y="18" width="14" height="8" fill="#ffffff"/>
  <rect x="42" y="18" width="14" height="8" fill="#ffffff"/>
  <rect x="70" y="18" width="14" height="8" fill="#ffffff"/>
  <rect x="98" y="18" width="14" height="8" fill="#ffffff"/>
</svg>
